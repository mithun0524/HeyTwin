spring:
  application:
    name: heytwin-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heytwin}
    username: ${DB_USERNAME:heytwin}
    password: ${DB_PASSWORD:heytwin}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_enum_type: postgres_enum
        format_sql: true
        show_sql: false
    open-in-view: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

security:
  jwt:
    secret: ${JWT_SECRET:1c99cbb3f8e04588b7c6a1e25d3c4f2b9d7e4f6a8b0c2d4e6f8091a2b3c4d5}
    expiration: ${JWT_EXPIRATION:3600000}

ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_KEY:dev-key}

logging:
  level:
    root: INFO
    com.heytwin: DEBUG

ingestion:
  opentdb:
    base-url: ${OPENTDB_BASE_URL:https://opentdb.com}
    default-amount: ${OPENTDB_DEFAULT_AMOUNT:50}
    cron: ${OPENTDB_CRON:0 0 2 * * *}
    enabled: ${OPENTDB_ENABLED:true}
